<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Content Planner — BlowViral AI</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#09090f;
  color:white;
  min-height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:250px;
  min-height:100vh;
  background:#101018;
  border-right:1px solid #252535;
  padding:25px 15px;
}

.logo{
  font-size:23px;
  font-weight:bold;
  padding:10px 15px 35px;
}

.logo span{
  color:#8b5cf6;
}

.menu a{
  display:block;
  text-decoration:none;
  color:#a1a1aa;
  padding:14px;
  margin-bottom:7px;
  border-radius:12px;
  transition:.3s;
}

.menu a:hover,
.menu a.active{
  background:#211936;
  color:white;
}

/* MAIN */

.main{
  flex:1;
  padding:35px;
  max-width:1400px;
}

.header{
  margin-bottom:30px;
}

.header h1{
  font-size:32px;
  margin-bottom:10px;
}

.header p{
  color:#888;
}

/* ADD CONTENT */

.planner-box{
  background:#12121d;
  border:1px solid #292938;
  border-radius:20px;
  padding:25px;
  margin-bottom:30px;
}

.planner-box h2{
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:9px;
}

label{
  color:#aaa;
  font-size:14px;
}

input,
select,
textarea{
  background:#191925;
  border:1px solid #303040;
  color:white;
  padding:15px;
  border-radius:12px;
  outline:none;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#8b5cf6;
}

.add-btn{
  width:100%;
  margin-top:20px;
  padding:17px;
  border:none;
  border-radius:13px;
  background:linear-gradient(90deg,#7c3aed,#2563eb);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:30px;
}

.stat-card{
  background:#12121d;
  border:1px solid #292938;
  padding:20px;
  border-radius:16px;
}

.stat-card small{
  color:#888;
}

.stat-number{
  font-size:28px;
  font-weight:bold;
  color:#a78bfa;
  margin-top:10px;
}

/* PLANNED CONTENT */

.content-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.content-header h2{
  font-size:24px;
}

.clear-btn{
  background:#211936;
  border:1px solid #5939a0;
  color:#c4b5fd;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
}

.content-list{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.content-card{
  background:#12121d;
  border:1px solid #292938;
  border-radius:18px;
  padding:20px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
}

.content-info{
  flex:1;
}

.content-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

.content-details{
  color:#888;
  font-size:14px;
  line-height:1.6;
}

.badges{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.badge{
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
}

.platform{
  background:#211936;
  color:#c4b5fd;
}

.idea{
  background:#1d2a3a;
  color:#7dd3fc;
}

.draft{
  background:#332b14;
  color:#facc15;
}

.ready{
  background:#123025;
  color:#4ade80;
}

.posted{
  background:#242424;
  color:#ddd;
}

.delete-btn{
  background:#35151a;
  border:1px solid #7f1d1d;
  color:#fca5a5;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}

/* EMPTY */

.empty{
  background:#12121d;
  border:1px dashed #353545;
  padding:45px;
  border-radius:18px;
  text-align:center;
  color:#888;
}

/* MOBILE */

@media(max-width:1000px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:800px){

  .sidebar{
    width:65px;
    padding:15px 6px;
  }

  .logo{
    font-size:0;
    padding:10px;
  }

  .logo:after{
    content:"⚡";
    font-size:25px;
  }

  .menu a{
    font-size:0;
    text-align:center;
    padding:14px 3px;
  }

  .menu a:first-letter{
    font-size:19px;
  }

  .main{
    padding:20px;
  }

  .header h1{
    font-size:26px;
  }

  .grid,
  .stats{
    grid-template-columns:1fr;
  }

  .content-card{
    flex-direction:column;
    align-items:flex-start;
  }

}

</style>
</head>

<body>


<!-- SIDEBAR -->

<div class="sidebar">

  <div class="logo">
    BLOW<span>VIRAL</span>
  </div>

  <div class="menu">

    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="coach.html">🤖 AI Coach</a>
    <a href="ideas.html">💡 Viral Ideas</a>
    <a href="script.html">✍️ Script Studio</a>
    <a href="analyzer.html">🎬 Video Analyzer</a>
    <a href="trends.html">🔥 Trend Radar</a>
    <a href="dna.html">🧬 Viral DNA</a>
    <a class="active" href="planner.html">📅 Planner</a>

  </div>

</div>


<!-- MAIN -->

<div class="main">

  <div class="header">

    <h1>📅 Content Planner</h1>

    <p>
      Plan your content, stay consistent and organize your viral strategy.
    </p>

  </div>


  <!-- ADD CONTENT -->

  <div class="planner-box">

    <h2>➕ Plan New Content</h2>

    <div class="grid">

      <div class="field">

        <label>Content title</label>

        <input
          id="title"
          placeholder="Example: The truth about Akaza..."
        >

      </div>


      <div class="field">

        <label>Publishing date</label>

        <input
          type="date"
          id="date"
        >

      </div>


      <div class="field">

        <label>Platform</label>

        <select id="platform">
          <option>TikTok</option>
          <option>YouTube Shorts</option>
          <option>Instagram Reels</option>
          <option>Facebook Reels</option>
        </select>

      </div>


      <div class="field">

        <label>Status</label>

        <select id="status">
          <option>Idea</option>
          <option>Draft</option>
          <option>Ready</option>
          <option>Posted</option>
        </select>

      </div>

    </div>


    <div class="field" style="margin-top:18px;">

      <label>Notes</label>

      <textarea
        id="notes"
        placeholder="Hook, script idea, editing notes..."
      ></textarea>

    </div>


    <button class="add-btn" onclick="addContent()">

      ➕ Add To Planner

    </button>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat-card">

      <small>📅 Total Planned</small>

      <div class="stat-number" id="total">0</div>

    </div>


    <div class="stat-card">

      <small>💡 Ideas</small>

      <div class="stat-number" id="ideas">0</div>

    </div>


    <div class="stat-card">

      <small>🎬 Ready</small>

      <div class="stat-number" id="ready">0</div>

    </div>


    <div class="stat-card">

      <small>🚀 Posted</small>

      <div class="stat-number" id="posted">0</div>

    </div>

  </div>


  <!-- CONTENT -->

  <div class="content-header">

    <h2>📋 Your Content Plan</h2>

    <button class="clear-btn" onclick="clearPlanner()">
      🗑 Clear All
    </button>

  </div>


  <div
    class="content-list"
    id="contentList"
  >

  </div>


</div>


<script>

/* LOAD SAVED CONTENT */

let contents =
  JSON.parse(localStorage.getItem("blowviralPlanner")) || [];


/* ADD CONTENT */

function addContent(){

  const title =
    document.getElementById("title").value.trim();

  const date =
    document.getElementById("date").value;

  const platform =
    document.getElementById("platform").value;

  const status =
    document.getElementById("status").value;

  const notes =
    document.getElementById("notes").value.trim();


  if(!title || !date){

    alert("Please enter a title and date!");

    return;

  }


  const content = {

    id: Date.now(),

    title,

    date,

    platform,

    status,

    notes

  };


  contents.push(content);


  saveContents();


  document.getElementById("title").value = "";
  document.getElementById("notes").value = "";


  renderContents();

}


/* SAVE */

function saveContents(){

  localStorage.setItem(
    "blowviralPlanner",
    JSON.stringify(contents)
  );

}


/* RENDER */

function renderContents(){

  const list =
    document.getElementById("contentList");


  list.innerHTML = "";


  if(contents.length === 0){

    list.innerHTML = `

      <div class="empty">

        <h2>📭 No content planned yet</h2>

        <p style="margin-top:10px;">
          Start planning your next viral video!
        </p>

      </div>

    `;

  }


  contents
    .sort((a,b) => new Date(a.date) - new Date(b.date))
    .forEach(content => {


      const statusClass =
        content.status.toLowerCase();


      list.innerHTML += `

        <div class="content-card">

          <div class="content-info">

            <div class="content-title">

              ${content.title}

            </div>


            <div class="content-details">

              📅 ${content.date}

              <br>

              📝 ${content.notes || "No notes"}

            </div>


            <div class="badges">

              <span class="badge platform">

                ${content.platform}

              </span>


              <span class="badge ${statusClass}">

                ${content.status}

              </span>

            </div>

          </div>


          <button
            class="delete-btn"
            onclick="deleteContent(${content.id})"
          >

            🗑 Delete

          </button>

        </div>

      `;

    });


  updateStats();

}


/* DELETE */

function deleteContent(id){

  contents =
    contents.filter(content => content.id !== id);


  saveContents();


  renderContents();

}


/* CLEAR */

function clearPlanner(){

  if(!confirm("Delete all planned content?")){
    return;
  }


  contents = [];


  saveContents();


  renderContents();

}


/* STATS */

function updateStats(){

  document.getElementById("total").innerText =
    contents.length;


  document.getElementById("ideas").innerText =
    contents.filter(c => c.status === "Idea").length;


  document.getElementById("ready").innerText =
    contents.filter(c => c.status === "Ready").length;


  document.getElementById("posted").innerText =
    contents.filter(c => c.status === "Posted").length;

}


/* START */

renderContents();

</script>


</body>
</html>
